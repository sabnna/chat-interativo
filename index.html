<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Virtual - Bate-papo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f8fafc;
        }

        .chat-card {
            width: 100%;
            max-width: 480px;
            height: 640px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .chat-header {
            padding: 18px 24px;
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
        }

        .title-group h1 {
            font-size: 1rem;
            font-weight: 700;
            color: #f8fafc;
        }

        .status {
            font-size: 0.75rem;
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            display: inline-block;
            box-shadow: 0 0 8px #4ade80;
        }

        .btn-restart {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-restart:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            transform: scale(1.03);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        .msg {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.92rem;
            line-height: 1.45;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            word-break: break-word;
        }

        .msg.bot {
            align-self: flex-start;
            background: #334155;
            color: #f1f5f9;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 12px 16px;
            background: #334155;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            width: fit-content;
            animation: fadeIn 0.2s ease;
        }

        .dot {
            width: 7px;
            height: 7px;
            background: #94a3b8;
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-input-area {
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 12px 18px;
            border-radius: 14px;
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .chat-input-area input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
            background: rgba(255, 255, 255, 0.08);
        }

        .chat-input-area input::placeholder {
            color: #94a3b8;
        }

        .btn-send {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        .btn-send:active {
            transform: translateY(0);
        }

        .btn-send svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <div class="chat-card">
        <header class="chat-header">
            <div class="header-info">
                <div class="avatar">🤖</div>
                <div class="title-group">
                    <h1>Assistente Virtual</h1>
                    <span class="status">Online</span>
                </div>
            </div>
            <button class="btn-restart" id="btnRestart" onclick="reiniciar()">🔄 Recomeçar</button>
        </header>

        <div class="chat-messages" id="chatBox"></div>

        <form class="chat-input-area" id="chatForm" onsubmit="enviarMensagem(event)">
            <input type="text" id="userInput" placeholder="Digite sua resposta aqui..." autocomplete="off" autofocus>
            <button type="submit" class="btn-send" title="Enviar">
                <svg viewBox="0 0 24 24">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </form>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        let etapa = 0;
        let dados = { nome: '', origem: '', local: '' };

        function escapar(texto) {
            return texto
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function adicionarMensagem(texto, tipo = 'bot') {
            const div = document.createElement('div');
            div.className = `msg ${tipo}`;
            if (tipo === 'user') {
                div.textContent = texto;
            } else {
                div.innerHTML = texto.replace(/\n/g, '<br>');
            }
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function mostrarDigitando() {
            const typing = document.createElement('div');
            typing.className = 'typing-indicator';
            typing.id = 'typingIndicator';
            typing.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            chatBox.appendChild(typing);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removerDigitando() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        function responderBot(texto, delay = 600) {
            mostrarDigitando();
            setTimeout(() => {
                removerDigitando();
                adicionarMensagem(texto, 'bot');
            }, delay);
        }

        function iniciar() {
            chatBox.innerHTML = '';
            etapa = 0;
            dados = { nome: '', origem: '', local: '' };
            userInput.disabled = false;
            userInput.value = '';
            userInput.focus();
            responderBot('Olá! 👋 Seja muito bem-vindo(a)!<br><strong>Qual o seu nome?</strong>', 300);
        }

        function enviarMensagem(e) {
            e.preventDefault();
            const texto = userInput.value.trim();
            if (!texto) return;

            adicionarMensagem(texto, 'user');
            userInput.value = '';

            if (etapa === 0) {
                dados.nome = texto;
                etapa = 1;
                responderBot(`Olá <strong>${escapar(dados.nome)}</strong>, é um prazer te conhecer! Seja bem-vindo(a)! 🎉<br><br><strong>De onde você é?</strong>`);
            } else if (etapa === 1) {
                dados.origem = texto;
                etapa = 2;
                responderBot(`Que legal que você é de <strong>${escapar(dados.origem)}</strong>! 🗺️<br><br><strong>Onde fica essa cidade?</strong>`);
            } else if (etapa === 2) {
                dados.local = texto;
                etapa = 3;
                responderBot(`Show! Nunca tive a chance de conhecer <strong>${escapar(dados.local)}</strong>, espero ir lá um dia! ✨🎈`);
                userInput.placeholder = 'Conversa finalizada. Clique em Recomeçar para reiniciar.';
                userInput.disabled = true;
            }
        }

        function reiniciar() {
            iniciar();
        }

        iniciar();
    </script>
</body>
</html>
